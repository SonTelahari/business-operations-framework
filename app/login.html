<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Business Ledger</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-brand" id="loginBrand" aria-label="Business">
        <img class="hidden" id="loginBusinessLogo" alt="">
        <div class="auth-monogram" id="loginBusinessMonogram" aria-hidden="true">BL</div>
        <p class="eyebrow">Employee Desk</p>
        <h1 id="loginLedgerName">Business Ledger</h1>
      </section>

      <section class="auth-panel">
        <div class="auth-tabs" role="tablist" aria-label="Account access">
          <button class="auth-tab active" id="showLoginButton" type="button" role="tab" aria-selected="true">Sign In</button>
          <button class="auth-tab" id="showRegisterButton" type="button" role="tab" aria-selected="false">Request Access</button>
        </div>

        <form class="auth-form" id="loginForm">
          <div>
            <p class="eyebrow">Welcome Back</p>
            <h2>Sign in to the desk</h2>
          </div>
          <label>
            In-game Character Name
            <input id="loginNameInput" name="fullName" type="text" autocomplete="username" required>
            <span class="field-hint">Use the character name registered for your employee account.</span>
          </label>
          <label>
            Password
            <input id="loginPasswordInput" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button auth-submit" type="submit">Sign In</button>
        </form>

        <form class="auth-form hidden" id="registerForm">
          <div>
            <p class="eyebrow">New Employee</p>
            <h2>Request an account</h2>
            <p class="field-hint">This is a roleplay staff account. Enter only your in-game character name. No real-life name or personal information is requested.</p>
          </div>
          <label>
            In-game Character Name
            <input id="registerNameInput" name="fullName" type="text" autocomplete="username" required>
            <span class="field-hint">Use your character's first and last name as it appears in game.</span>
          </label>
          <label>
            Password
            <input id="registerPasswordInput" name="password" type="password" autocomplete="new-password" minlength="10" required>
            <span class="field-hint">At least 10 characters</span>
          </label>
          <label>
            Confirm Password
            <input id="registerConfirmInput" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
          </label>
          <button class="primary-button auth-submit" type="submit">Send Request</button>
        </form>

        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
